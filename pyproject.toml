[project]
name = "scout-agent"
version = "0.1.0"
description = "Scout: a purpose-aware company intelligence agent"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "D102", "D103"]
# Any is legitimate for generic settings coercion; SIM905 would bloat the stopword list.
ignore = ["ANN401", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D102", "D103"]
